name: Announce Discord streams
on:
  schedule:
    - cron: '14,44 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check connections without publishing or changing state
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    if: vars.SIRUCORD_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/monitor-run.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit
