name: Active Discord checks
on:
  schedule:
    # The base monitor supplies :14 and :44; together they check every 5 minutes.
    - cron: '4,9,19,24,29,34,39,49,54,59 * * * *'

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    if: vars.SIRUCORD_ENABLED == 'true' && vars.SIRUCORD_SCHEDULER != 'cronjob'
    uses: ./.github/workflows/monitor-run.yml
    with:
      dry_run: false
    secrets: inherit
